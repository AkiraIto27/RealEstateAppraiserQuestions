name: Generate AI Explanations

on:
  # fetch_laws.yml完了後に自動実行（1日目: r03-r05）
  workflow_run:
    workflows: ["Fetch laws snapshot from e-Gov"]
    types:
      - completed
  # 9月2日に2日目を自動実行（r06-r07）
  schedule:
    - cron: "0 0 2 9 *"  # 毎年9月2日 0:00 UTC
  workflow_dispatch:
    inputs:
      batch_start:
        description: 'Batch start index (0-4)'
        required: false
        default: '0'
      batch_end:
        description: 'Batch end index (1-5)'
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # workflow_runでトリガーする場合、成功時のみ実行
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm i

      - name: Determine batch range
        id: batch
        run: |
          # workflow_runの場合は1日目（r03-r05）
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "BATCH_START=0" >> $GITHUB_OUTPUT
            echo "BATCH_END=3" >> $GITHUB_OUTPUT
            echo "Running Day 1: r03, r04, r05"
          # scheduleの場合は2日目（r06-r07）
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            echo "BATCH_START=3" >> $GITHUB_OUTPUT
            echo "BATCH_END=5" >> $GITHUB_OUTPUT
            echo "Running Day 2: r06, r07"
          # 手動実行の場合は入力値を使用
          else
            echo "BATCH_START=${{ github.event.inputs.batch_start || '0' }}" >> $GITHUB_OUTPUT
            echo "BATCH_END=${{ github.event.inputs.batch_end || '5' }}" >> $GITHUB_OUTPUT
            echo "Running manual batch"
          fi

      - name: Generate AI explanations
        run: npm run build:ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH_START: ${{ steps.batch.outputs.BATCH_START }}
          BATCH_END: ${{ steps.batch.outputs.BATCH_END }}

      - name: Commit AI explanations to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist_with_ai
          if git diff --cached --quiet; then
            echo "No AI explanation changes to commit."
          else
            git commit -m "chore: generate AI explanations [skip ci]"
            git push
          fi
