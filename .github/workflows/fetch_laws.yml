name: Fetch laws snapshot from e-Gov

on:
    schedule:
        - cron: "0 0 1 9 *"
    workflow_dispatch: {}

permissions:
    contents: write

jobs:
    fetch-laws:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install requests

            - name: Run fetch_laws_from_bulk.py
              run: |
                  python scripts/fetch_laws_from_bulk.py

            - name: Commit and push generated laws
              if: github.ref == 'refs/heads/main'
              run: |
                  git status
                  git config user.name  "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  # laws_raw はサイズが大きいのでコミットしない
                  git add laws || true

                  if git diff --cached --quiet; then
                    echo "No changes to commit."
                  else
                    git commit -m "chore: update law snapshots"
                    git push origin HEAD:main
                  fi
