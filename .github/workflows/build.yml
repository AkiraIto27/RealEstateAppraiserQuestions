name: Build, Commit dist, and Deploy Pages

on:
  schedule:
    - cron: "0 0 1 8 *"  # 毎年8月1日 0:00 UTC
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'          # 無限ループ回避（dist更新で再トリガーしない）
  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # ← dist をコミットするために必要
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true   # ← GITHUB_TOKEN で push するために必要
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - run: npm ci || npm i
      - run: npm run build            # dist/manifest.json と dist/bundles/** を生成

      - name: Commit dist to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "No dist changes to commit."
          else
            git commit -m "chore: build dist [skip ci]"   # 追加のループ回避
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Generate explanations (RAG)
        if: github.ref == 'refs/heads/main'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate_explanations.mjs

      - name: Generate explanations in batches and push (5 at a time)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 念のため main を最新化（他のpushが入った時の保険）
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          max_batches=200  # 安全装置（5問×200=1000問）
          for i in $(seq 1 $max_batches); do
            echo "===== batch $i ====="

            # 5問だけ生成
            node scripts/generate_explanations.mjs --limit 5

            # 差分が無ければ終了（＝もう埋めるものが無い）
            if git diff --quiet; then
              echo "No changes detected. Done."
              break
            fi

            # 変更をコミットしてpush
            git add dist || true
            git commit -m "Auto-generate explanations (batch $i)" || true

            # push前にリモート取り込み（競合保険）
            git pull --rebase origin main || true
            git push origin main
          done


  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
