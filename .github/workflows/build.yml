name: Build dist bundles

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - "dist/**"   # dist をコミットしても build が無限ループしないように

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: |
          set -euo pipefail
          npm run build

          echo "=== dist changes (after build) ==="
          git status --porcelain dist | head -n 200

      - name: Commit and push dist if changed
        run: |
          set -euo pipefail

          if git diff --quiet -- dist; then
            echo "No dist changes. Done."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A dist
          git commit -m "chore: build dist [skip ci]"
          git push origin HEAD:main
