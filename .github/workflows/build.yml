name: Build, Commit dist, and Deploy Pages

on:
  schedule:
    - cron: "0 0 1 8 *"  # 毎年8月1日 0:00 UTC
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'          # 無限ループ回避（dist更新で再トリガーしない）
  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # ← dist をコミットするために必要
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true   # ← GITHUB_TOKEN で push するために必要
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - run: npm ci || npm i
      - run: npm run build
      - name: Generate explanations in batches and push (5 at a time)
        if: github.ref == 'refs/heads/main'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          max_batches=200
          for i in $(seq 1 $max_batches); do
            echo "===== batch $i ====="
            node scripts/generate_explanations.mjs --limit 5

            if git diff --quiet; then
              echo "No changes detected. Done."
              break
            fi

            git pull --rebase origin main || true
            git add -A dist
            git commit -m "chore: auto-generate explanations (batch $i) [skip ci]" || true
            git push origin HEAD:main
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
